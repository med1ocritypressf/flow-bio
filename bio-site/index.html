<!DOCTYPE html>
<html lang="ru" data-theme="black">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flow — bio</title>
  <meta name="description" content="flow — все мои ссылки в одном месте." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="flow — bio" />
  <meta property="og:description" content="Все мои соцсети и контакты в одном месте." />
  <meta property="og:image" content="assets/avatar.jpg" />
  <link rel="icon" href="assets/avatar.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ФОН -->
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- ВХОД -->
  <div class="enter" id="enter">
    <div class="enter__inner">
      <div class="enter__pulse"></div>
      <div class="enter__tag">[ click to enter ]</div>
      <div class="enter__title" id="enterName">flow</div>
      <div class="enter__hint">нажми чтобы войти</div>
      <button class="enter__btn" type="button">enter</button>
    </div>
  </div>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="topbar">
    <div class="topbar__left">
      <span class="dot"></span>
      <span class="topbar__user" id="topbarName">@flow</span>
      <span class="topbar__views"><span id="views">0</span> views</span>
    </div>
    <div class="topbar__right">
      <button class="pill-btn" id="shareBtn" type="button" aria-label="Поделиться">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M18 16.08a2.9 2.9 0 00-1.96.77L8.9 12.7c.05-.23.08-.46.08-.7s-.03-.47-.08-.7l7.05-4.11c.52.48 1.2.78 1.95.78a2.92 2.92 0 100-5.84 2.92 2.92 0 00-2.92 2.92c0 .24.03.47.08.7L8.04 9.76A2.9 2.9 0 006.08 9a2.92 2.92 0 100 5.84c.75 0 1.44-.3 1.96-.78l7.05 4.12c-.05.21-.08.43-.08.66A2.85 2.85 0 1018 16.08z"/></svg>
        <span>share</span>
      </button>
    </div>
  </header>

  <!-- КАРТОЧКА -->
  <main class="wrap">
    <section class="card" id="card">
      <div class="card__shine" aria-hidden="true"></div>

      <div class="avatar-wrap">
        <div class="avatar-ring" aria-hidden="true"></div>
        <img class="avatar" id="avatar" alt="Аватар flow" width="128" height="128" />
        <div class="avatar avatar--fallback" id="avatarFallback" hidden>f</div>
      </div>

      <h1 class="name">
        <span id="name">flow</span>
        <svg class="verified" id="verified" viewBox="0 0 24 24" aria-label="verified">
          <defs><linearGradient id="vgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#ff7a33"/></linearGradient></defs>
          <path fill="currentColor" d="M12 1.8l2.5 2.2 3.3-.4 1.2 3.1 3 1.4-.8 3.2 2 2.6-2.4 2.3.2 3.3-3.3.5-1.8 2.7L12 21.6l-3.1 1.4-1.8-2.7-3.3-.5.2-3.3-2.4-2.3 2-2.6-.8-3.2 3-1.4 1.2-3.1 3.3.4L12 1.8z"/>
          <path fill="#fff" d="M10.6 15.6l-3.2-3.2 1.4-1.4 1.8 1.8 4.2-4.2 1.4 1.4-5.6 5.6z"/>
        </svg>
      </h1>
      <div class="uid" id="uid">uid: 1</div>

      <p class="typed"><span class="typed__prefix">></span> <span id="typed"></span><span class="caret" aria-hidden="true"></span></p>
      <p class="bio" id="bio"></p>

      <div class="badges" id="badges"></div>

      <div class="faceit" id="faceitWidget">
        <div class="faceit__head">
          <span class="faceit__brand">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M23.999 2.705a.167.167 0 00-.312-.1 1141.27 1141.27 0 00-6.053 9.375H.218c-.221 0-.301.282-.11.352 7.227 2.73 17.667 6.836 23.5 9.134.15.06.39-.08.39-.18z"/></svg>
            faceit • cs2
          </span>
          <span class="faceit__live"><i></i>live</span>
        </div>
        <div class="faceit__body">
          <div class="faceit__lvlbadge" title="FACEIT level">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs><linearGradient id="lvlgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5500"/><stop offset="1" stop-color="#FFB800"/></linearGradient></defs>
              <circle cx="32" cy="32" r="28" fill="rgba(255,85,0,.08)" stroke="rgba(255,255,255,.08)" stroke-width="4"/>
              <circle id="faceitRing" cx="32" cy="32" r="28" fill="none" stroke="url(#lvlgrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="175.9" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/>
            </svg>
            <span id="faceitLvl">10</span>
          </div>
          <div class="faceit__num">
            <span class="faceit__elo" id="faceitElo">…</span>
            <span class="faceit__lbl">elo rating</span>
          </div>
          <div class="faceit__max">
            <b id="faceitMax">—</b>
            <span>max elo</span>
          </div>
        </div>
        <div class="faceit__bar" hidden><i id="faceitFill"></i></div>
        <div class="faceit__foot"><span id="faceitNick">-flooow</span><span id="faceitUpd">updating…</span></div>
      </div>

      <a class="playlist" id="playlist" href="https://open.spotify.com/playlist/1AZZzHV2rp5ua18Te5XjdV" target="_blank" rel="noopener">
        <img class="playlist__cover" id="playlistArt" src="https://image-cdn-fa.spotifycdn.com/image/ab67706c0000da84c8540c503444c5aa17f1f3a1" alt="Обложка плейлиста" width="52" height="52" />
        <div class="playlist__info">
          <div class="playlist__title">Spotify playlist</div>
          <div class="playlist__name" id="playlistName">Мой плейлист</div>
          <div class="playlist__meta" id="playlistMeta">мой вайб</div>
        </div>
        <span class="playlist__go" id="playlistToggle">
          <svg id="icoOpen" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
          <svg id="icoClose" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path fill="currentColor" d="M12 8l-6 6 1.4 1.4L12 10.8l4.6 4.6L18 14l-6-6z"/></svg>
        </span>
      </a>
      <div class="embed" id="embedWrap" hidden>
        <div class="embed__bar">
          <span>сейчас играет</span>
          <span class="embed__actions">
            <a id="playlistExt" href="https://open.spotify.com/playlist/1AZZzHV2rp5ua18Te5XjdV" target="_blank" rel="noopener">открыть в Spotify</a>
            <button id="embedHide" type="button">скрыть</button>
          </span>
        </div>
        <iframe id="spotifyFrame" title="Spotify playlist" width="100%" height="352" frameborder="0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>

      <div class="divider"><span>links</span></div>

      <nav class="links" id="links" aria-label="Мои ссылки"></nav>

      <div class="socials" id="socials"></div>

      <footer class="footer" id="footer"></footer>
    </section>
    <p class="made">made by <b>flow</b></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="bgMusic" loop preload="none"></audio>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
